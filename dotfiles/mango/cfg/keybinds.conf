# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys
# Synced with Hyprland reference config

# ============= APPLICATIONS =============
bind = SUPER, t, spawn, kitty
bind = SUPER, b, spawn, zen-beta
bind = SUPER, f, spawn, thunar
bind = SUPER, z, spawn, antigravity-ide
bind = SUPER+SHIFT, d, spawn, vesktop
bind = SUPER, y, spawn, ghostty -e yazi
bind = SUPER, e, spawn, emopicker9000
bind = SUPER, o, spawn, obs
bind = SUPER, g, spawn, gimp
bind = SUPER+SHIFT, t, spawn, ghostty
bind = SUPER+ALT, m, spawn, pavucontrol

# ============= WINDOW MANAGEMENT =============
bind = SUPER, q, killclient,
bind = SUPER+SHIFT, q, killclient,
bind = SUPER+SHIFT, i, switch_layout,
bind = SUPER+CTRL, f, togglefullscreen,
bind = SUPER+SHIFT, f, togglefloating,
bind = SUPER+SHIFT, m, togglemaximizescreen,

# ============= WINDOW NAVIGATION & FOCUS (ARROW KEYS) =============
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down

# ============= WINDOW NAVIGATION & FOCUS (VI-STYLE) =============
bind = SUPER, h, focusdir, left
bind = SUPER, l, focusdir, right
bind = SUPER, k, focusdir, up
bind = SUPER, j, focusdir, down

# ============= WINDOW SWAPPING (ARROW KEYS) =============
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down

# ============= WINDOW SWAPPING (VI-STYLE) =============
bind = SUPER+SHIFT, h, exchange_client, left
bind = SUPER+SHIFT, l, exchange_client, right
bind = SUPER+SHIFT, k, exchange_client, up
bind = SUPER+SHIFT, j, exchange_client, down

# ============= TAGS (1-9) =============
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

bind = SUPER+CTRL, 1, toggletag, 1, 0
bind = SUPER+CTRL, 2, toggletag, 2, 0
bind = SUPER+CTRL, 3, toggletag, 3, 0
bind = SUPER+CTRL, 4, toggletag, 4, 0
bind = SUPER+CTRL, 5, toggletag, 5, 0
bind = SUPER+CTRL, 6, toggletag, 6, 0
bind = SUPER+CTRL, 7, toggletag, 7, 0
bind = SUPER+CTRL, 8, toggletag, 8, 0
bind = SUPER+CTRL, 9, toggletag, 9, 0

# ============= WINDOW MOVEMENT TO MONITOR =============
bind = SUPER+ALT, Left, tagmon, left
bind = SUPER+ALT, Right, tagmon, right
bind = SUPER+ALT, h, tagmon, left
bind = SUPER+ALT, l, tagmon, right

# ============= SHELL BINDINGS =============
bind = SUPER, space, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = SUPER+SHIFT, Return, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = SUPER+SHIFT, w, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle wallpaper
bind = SUPER, Tab, spawn, quickshell ipc -c overview call overview toggle
bind = SUPER, x, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle session
bind = SUPER, k, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle keybinds
bind = SUPER, c, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle network
bind = SUPER, v, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle clipboard
bind = SUPER, m, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle calendar
bind = SUPER+ALT, p, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle settings
bind = SUPER+SHIFT, comma, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle settings
bind = SUPER+CTRL, r, spawn, ~/.config/hypr/scripts/qs_manager.sh toggle focustime

# ============= ACTIONS & SCRIPTS =============
bind = SUPER+SHIFT, a, spawn, ~/.config/hypr/scripts/toggle-animations.sh
bind = SUPER, s, spawn, ~/.config/hypr/scripts/screenshot.sh
bind = SUPER+CTRL, s, spawn, ~/.config/hypr/scripts/screenshot.sh --full
bind = SUPER+SHIFT, s, spawn, ~/.config/hypr/scripts/screenshot.sh --edit
bind = SUPER+ALT, s, spawn, ~/.config/hypr/scripts/screenshot.sh --edit
bind = SUPER+ALT, a, spawn, ~/.config/hypr/scripts/text-extractor.sh
bind = SUPER+SHIFT, r, reload_config
bind = SUPER+ALT, g, spawn, ~/.config/hypr/scripts/gamemode.sh
bind = SUPER+CTRL, l, spawn, ~/.config/hypr/scripts/lock.sh
bind = SUPER+SHIFT, h, spawn, pgrep -x hyprsunset && pkill -x hyprsunset || hyprsunset



# ============= SPECIAL WORKSPACE =============
bind = SUPER, n, toggle_scratchpad
bind = SUPER+SHIFT, space, toggle_scratchpad

# ============= HARDWARE & MEDIA KEYS =============
bind = NONE, XF86MonBrightnessUp, spawn, brightnessctl set +5%
bind = NONE, XF86MonBrightnessDown, spawn, brightnessctl set 5%-
bind = NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = NONE, XF86AudioPlay, spawn, playerctl play-pause
bind = NONE, XF86AudioPause, spawn, playerctl pause
bind = NONE, XF86AudioNext, spawn, playerctl next
bind = NONE, XF86AudioPrev, spawn, playerctl previous
bind = NONE, XF86AudioMicMute, spawn, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# ============= MOUSE BINDINGS =============
mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize
axisbind = SUPER, UP, focusdir, left
axisbind = SUPER, DOWN, focusdir, right
